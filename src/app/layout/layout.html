<nz-layout class="app-layout">
  <nz-sider
    class="menu-sidebar"
    nzWidth="256px"
    nzBreakpoint="md"
    [(nzCollapsed)]="isCollapsed"
    [nzTrigger]="null"
  >
    <div class="sidebar-logo">
      <a href="https://ng.ant.design/" target="_blank">
        <img src="https://ng.ant.design/assets/img/logo.svg" alt="logo" />
        <h1>矩阵</h1>
      </a>
    </div>
    <ul nz-menu nzTheme="dark" nzMode="inline" [nzInlineCollapsed]="isCollapsed">
      <li nz-menu-item routerLink="/project" [nzMatchRouter]="true">
        <nz-icon nzType="project" nzTheme="outline" />
        <span>项目</span>
      </li>
      <li nz-menu-item routerLink="/device" [nzMatchRouter]="true">
        <nz-icon nzType="bulb" nzTheme="outline" />
        <span>设备</span>
      </li>
      <li nz-menu-item routerLink="/product" [nzMatchRouter]="true">
        <nz-icon nzType="table" nzTheme="outline" />
        <span>产品</span>
      </li>
      <li nz-menu-item routerLink="/settings" [nzMatchRouter]="true">
        <nz-icon nzType="user" nzTheme="outline" />
        <span>我</span>
      </li>
    </ul>
  </nz-sider>
  <nz-layout>
    <nz-header>
      <div class="app-header">
        <span class="header-trigger" (click)="isCollapsed = !isCollapsed">
          <nz-icon class="trigger" [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'" />
        </span>
        <span class="header-right">
          <span class="org-name" routerLink="/org-picker" tabindex="0">
            <nz-icon nzType="bank" nzTheme="outline" />
            <span>{{ account.organization?.name || '选择组织' }}</span>
          </span>
        </span>
      </div>
    </nz-header>
    <nz-content>
      <div class="inner-content">
        <router-outlet></router-outlet>
      </div>
    </nz-content>
    <nz-footer>
      2026
      ({{ version }})
    </nz-footer>
  </nz-layout>
</nz-layout>

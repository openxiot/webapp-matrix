<nz-form-item>
  <nz-form-label [nzSpan]="5" [nzRequired]="true">{{ '空间名称' | translate }}</nz-form-label>
  <nz-form-control>
    <input nz-input [value]="name()" (input)="onNameInput($event)" type="text"/>
  </nz-form-control>
</nz-form-item>
<nz-form-item>
  <nz-form-label [nzSpan]="5">{{ '空间类型' | translate }}</nz-form-label>
  <nz-form-control>
    <nz-radio-group [ngModel]="type()" nzButtonStyle="solid" (ngModelChange)="onTypeChange($event)">
      <label nz-radio-button nzValue="building">楼栋</label>
      <label nz-radio-button nzValue="floor">楼层</label>
      <label nz-radio-button nzValue="room">房间</label>
      <label nz-radio-button nzValue="zone">区域</label>
    </nz-radio-group>
  </nz-form-control>
</nz-form-item>

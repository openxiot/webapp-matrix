<nz-layout class="login-background">
  <nz-header class="login-header">
    <span>
      <img src="assets/favicon.ico" alt="logo" />
      <h3>矩阵</h3>
    </span>
  </nz-header>

  <nz-content>
    <div class="centered-card">
      <nz-card [nzBordered]="false">
        <div class="login-title">{{ '登录' | translate }}</div>

        <nz-divider></nz-divider>

        <nz-spin [nzSpinning]="platforms.isLoading()">
          <div class="login-btn-container">
            @if (config(); as primary) {
              <button nz-button nzType="primary" class="login-button" (click)="open(primary)">
                <span nz-icon [nzType]="iconOf(primary.platformId)" nzTheme="outline"></span>
                {{ primary.platformName }} {{ '登录' | translate }}
              </button>
            }
          </div>

          <nz-divider style="font-size: 12px; color: gray" [nzText]="'或使用以下方式登录' | translate"></nz-divider>

          <div class="login-btn-others">
            @for (item of others(); track item.platformId) {
              <button
                nz-button
                nzSize="large"
                nzShape="circle"
                nz-tooltip
                [nzTooltipTitle]="item.platformName"
                (click)="open(item)"
              >
                <span nz-icon [nzType]="iconOf(item.platformId)" nzTheme="outline"></span>
              </button>
            }
          </div>
        </nz-spin>
      </nz-card>
    </div>
  </nz-content>
</nz-layout>

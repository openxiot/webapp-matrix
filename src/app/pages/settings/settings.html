<div class="settings-page">
  <a routerLink="/account" class="profile-header">
    <nz-avatar
      class="profile-avatar"
      [nzSrc]="account.developer.avatar || undefined"
      [nzText]="initial()"
      [nzSize]="64"
    ></nz-avatar>
    <div class="profile-info">
      <div class="profile-name">{{ account.developer.name || '未命名' }}</div>
      <div class="profile-platform">{{ account.developer.platform }}</div>
    </div>
    <nz-icon nzType="right" nzTheme="outline" class="chevron" />
  </a>

  <nz-list class="settings-list" [nzBordered]="false" nzItemLayout="horizontal">
    <a nz-list-item routerLink="/org-picker">
      <nz-list-item-meta
        [nzTitle]="'当前组织'"
        [nzDescription]="account.organization?.name || '未选择组织'"
        [nzAvatar]="orgAvatar"
      />
      <ng-template #orgAvatar>
        <nz-icon nzType="bank" nzTheme="outline" class="row-icon" />
      </ng-template>
      <nz-icon nzType="right" nzTheme="outline" class="chevron" />
    </a>

    <a nz-list-item routerLink="/project-picker" [class.disabled]="!account.organization">
      <nz-list-item-meta
        [nzTitle]="'当前项目'"
        [nzDescription]="account.currentRootSpaceName() || '未选择项目'"
        [nzAvatar]="projectAvatar"
      />
      <ng-template #projectAvatar>
        <nz-icon nzType="home" nzTheme="outline" class="row-icon" />
      </ng-template>
      <nz-icon nzType="right" nzTheme="outline" class="chevron" />
    </a>

    <li nz-list-item>
      <nz-list-item-meta
        [nzTitle]="'深色模式'"
        [nzDescription]="theme.isDark() ? '已开启' : '已关闭'"
        [nzAvatar]="darkAvatar"
      />
      <ng-template #darkAvatar>
        <nz-icon [nzType]="theme.isDark() ? 'moon' : 'sun'" nzTheme="outline" class="row-icon" />
      </ng-template>
      <nz-switch [ngModel]="theme.isDark()" (ngModelChange)="theme.toggle()"></nz-switch>
    </li>

    <a nz-list-item routerLink="/about">
      <nz-list-item-meta [nzTitle]="'关于'" [nzDescription]="'微矩阵 · 物联网设备管理与监控平台'" [nzAvatar]="aboutAvatar" />
      <ng-template #aboutAvatar>
        <nz-icon nzType="question" nzTheme="outline" class="row-icon" />
      </ng-template>
      <nz-icon nzType="right" nzTheme="outline" class="chevron" />
    </a>
  </nz-list>
</div>

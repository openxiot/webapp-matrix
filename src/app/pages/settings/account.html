<div class="page">
  <div class="page-header">
    <button nz-button nzType="text" (click)="routerBack()">
      <nz-icon nzType="left" nzTheme="outline" />
      返回
    </button>
    <span class="page-title">账号</span>
  </div>

  <nz-card [nzBordered]="false" class="account-card">
    <div class="account-head">
      <nz-avatar
        [nzSrc]="account.developer.avatar || undefined"
        [nzText]="initial()"
        [nzSize]="72"
      ></nz-avatar>
      <div class="account-info">
        <div class="account-name">{{ account.developer.name || '未命名' }}</div>
        <div class="account-platform">{{ account.developer.platform }}</div>
      </div>
    </div>

    <nz-descriptions nzSize="small" [nzColumn]="1" class="account-desc">
      <nz-descriptions-item nzTitle="用户名">{{ account.developer.name || '-' }}</nz-descriptions-item>
      <nz-descriptions-item nzTitle="登录平台">{{ account.developer.platform || '-' }}</nz-descriptions-item>
      <nz-descriptions-item nzTitle="邮箱">{{ account.developer.email || '-' }}</nz-descriptions-item>
      <nz-descriptions-item nzTitle="当前组织">{{ account.organization?.name || '未选择' }}</nz-descriptions-item>
      <nz-descriptions-item nzTitle="当前项目">{{ account.currentRootSpaceName() || '未选择' }}</nz-descriptions-item>
    </nz-descriptions>
  </nz-card>

  <div class="logout-action">
    <button nz-button nzDanger nzBlock (click)="logout()">
      <nz-icon nzType="logout" nzTheme="outline" />
      退出登录
    </button>
  </div>
</div>

<!-- 设备信息编辑：每个表单项独立成一行 —— 与功能码 CommandEditComponent 同构：
     label 居左固定 nzSpan=4，值控件占该行余宽；不再两列并排。 -->
<div>
  <nz-form-item>
    <nz-form-label nzFor="deviceInfoManufacturer" [nzSpan]="4" [nzRequired]="true">{{ '厂家' | translate }}</nz-form-label>
    <nz-form-control>
      <input nz-input id="deviceInfoManufacturer" [value]="manufacturer()" (input)="onManufacturerInput($event)"
             placeholder="{{ '例如：特灵 / 开利 / 麦克维尔' | translate }}" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzFor="deviceInfoModel" [nzSpan]="4" [nzRequired]="true">{{ '型号' | translate }}</nz-form-label>
    <nz-form-control>
      <input nz-input id="deviceInfoModel" [value]="model()" (input)="onModelInput($event)"
             placeholder="{{ '例如：19XRV / CVHG' | translate }}" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzFor="deviceInfoSlaveId" [nzSpan]="4" [nzRequired]="true">{{ '从站地址' | translate }}</nz-form-label>
    <nz-form-control>
      <nz-input-number id="deviceInfoSlaveId" [ngModel]="slaveId()" (ngModelChange)="onSlaveIdChange($event)"
                       [nzMin]="0" [nzMax]="247" [nzStep]="1" style="width: 100%"></nz-input-number>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label [nzSpan]="4" [nzRequired]="true">{{ '可见度' | translate }}</nz-form-label>
    <nz-form-control>
      <nz-radio-group [ngModel]="visibility()" nzButtonStyle="solid" (ngModelChange)="onVisibilityChange($event)">
        <label nz-radio-button nzValue="private">{{ '私有' | translate }}</label>
        <label nz-radio-button nzValue="public">{{ '公开' | translate }}</label>
      </nz-radio-group>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzFor="deviceInfoDescription" [nzSpan]="4">{{ '描述' | translate }}</nz-form-label>
    <nz-form-control>
      <input nz-input id="deviceInfoDescription" [value]="description()" (input)="onDescriptionInput($event)" />
    </nz-form-control>
  </nz-form-item>
</div>

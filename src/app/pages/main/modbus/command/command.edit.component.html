<!-- 命令编辑对话框：骨架字段（名称/功能码/起始地址/逻辑地址）各自为独立组件，
     值区按功能码组合对应的表单值组件（01/02、03/04、05、06 单值组件；0F/10 复用表格块） -->
<modbus-command-name [(name)]="name" [readOnly]="readOnly" />

<modbus-command-fc [fc]="fc()" (fcChange)="onFcChange($event)" [readOnly]="readOnly" />

<modbus-command-start [(start)]="start" [readOnly]="readOnly" />

<modbus-command-logical-address [fc]="fc()" [start]="start()" />

<!-- 01/02 读位：数量 -->
@if (readBitFcs.has(fc())) {
  <modbus-command-quantity [(quantity)]="quantity"
                           [hintKey]="'该参数占用的位/线圈个数'"
                           [readOnly]="readOnly" />
}

<!-- 03/04 读寄存器：数量（非 string 锁为类型跨度）/ 数据格式 / 字节序 / 缩放系数 / 单位 -->
@if (readRegFcs.has(fc())) {
  <modbus-command-quantity [(quantity)]="quantity" [locked]="quantityLocked()" [readOnly]="readOnly" />
  <modbus-command-data-type [dataType]="dataType()" (dataTypeChange)="onDataTypeChange($event)" [readOnly]="readOnly" />
  <modbus-command-byte-order [(byteOrder)]="byteOrder" [options]="byteOrderOptions()" [readOnly]="readOnly" />
  <modbus-command-scale [(scale)]="scale" [readOnly]="readOnly" />
  <modbus-command-unit [(unit)]="unit" [readOnly]="readOnly" />
}

<!-- 05 写单个线圈：线圈状态 -->
@if (fc() === '05') {
  <modbus-command-coil-state [(coilState)]="coilState" [readOnly]="readOnly" />
}

<!-- 06 写单个寄存器：寄存器值 -->
@if (fc() === '06') {
  <modbus-command-register-value [(registerValue)]="registerValue" [readOnly]="readOnly" />
}

<!-- 0F 写多个线圈：线圈数量 + 线圈选择子表 -->
@if (fc() === '0F') {
  <nz-form-item>
    <nz-form-label [nzSpan]="4">{{ '线圈选择' | translate }}</nz-form-label>
    <nz-form-control>
      <modbus-command-multi-coils [(coils)]="coils" [readOnly]="readOnly" />
    </nz-form-control>
  </nz-form-item>
}

<!-- 10 写多个寄存器：寄存器表格 -->
@if (fc() === '10') {
  <nz-form-item>
    <nz-form-label [nzSpan]="4">{{ '寄存器表格' | translate }}</nz-form-label>
    <nz-form-control>
      <modbus-command-multi-registers [(registers)]="registers" [start]="start()" [readOnly]="readOnly" />
    </nz-form-control>
  </nz-form-item>
}

<!-- 值控件：数量（01/02 读位 = 位/线圈个数；03/04 读寄存器 = 类型跨度或长度）。
     readOnly（详情查看）直接以文本展示；表单项骨架与标签「数量」由父组件 command.edit 提供 -->
@if (readOnly()) {
  <span class="cmd-read-value">{{ quantity() ?? '-' }}</span>
} @else {
  <nz-input-number [ngModel]="quantity()" (ngModelChange)="onChange($event)" [nzMin]="1" [nzMax]="255"
                   [nzStep]="1" [nzDisabled]="locked()" style="width: 100%"></nz-input-number>
}
@if (hintKey()) {
  <span class="cmd-hint cmd-hint-block">{{ hintKey() | translate }}</span>
}

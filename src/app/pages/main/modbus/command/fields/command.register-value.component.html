<!-- 寄存器值 -->

  <nz-form-label [nzSpan]="4" [nzRequired]="true">{{ '寄存器值' | translate }}</nz-form-label>
  <nz-form-control>
    <nz-input-number [ngModel]="registerValue()" (ngModelChange)="onChange($event)" [nzMin]="-32768"

  </nz-form-control>
</nz-form-item>

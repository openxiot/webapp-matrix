<!-- 线圈状态 -->
<nz-form-item>
  <nz-form-label [nzSpan]="4" [nzRequired]="true">{{ '线圈状态' | translate }}</nz-form-label>
  <nz-form-control>
    <nz-select [ngModel]="coilState()" (ngModelChange)="onChange($event)" [nzDisabled]="readOnly()" style="width: 100%">
      @for (option of coilStateOptions; track option.value) {
        <nz-option [nzValue]="option.value" [nzLabel]="option.label"></nz-option>
      }
    </nz-select>
  </nz-form-control>
</nz-form-item>

<!-- 字节序 -->
<nz-form-item>
  <nz-form-label [nzSpan]="4" [nzRequired]="true">{{ '字节序' | translate }}</nz-form-label>
  <nz-form-control>
    <nz-select [ngModel]="byteOrder()" (ngModelChange)="onChange($event)" [nzDisabled]="readOnly()" style="width: 100%">
      @for (option of options(); track option) {
        <nz-option [nzValue]="option" [nzLabel]="display(option)"></nz-option>
      }
    </nz-select>
  </nz-form-control>
</nz-form-item>

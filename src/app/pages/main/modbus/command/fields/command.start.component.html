<!-- 起始地址（十进制，0 基数据地址） -->
<nz-form-item>
  <nz-form-label [nzSpan]="4" [nzRequired]="true">{{ '起始地址' | translate }}</nz-form-label>
  <nz-form-control>
    <nz-input-number [ngModel]="start()" (ngModelChange)="onChange($event)" [nzMin]="0" [nzMax]="65535"
                     [nzStep]="1" [nzDisabled]="readOnly()" style="width: 100%"></nz-input-number>
  </nz-form-control>
</nz-form-item>

<!-- 数量 -->
<nz-form-item>
  <nz-form-label [nzSpan]="4" [nzRequired]="true">{{ '数量' | translate }}</nz-form-label>
  <nz-form-control>
    <nz-input-number [ngModel]="quantity()" (ngModelChange)="onChange($event)" [nzMin]="1" [nzMax]="255"
                     [nzStep]="1" [nzDisabled]="readOnly() || locked()" style="width: 100%"></nz-input-number>
    @if (hintKey()) {
      <span class="cmd-hint cmd-hint-block">{{ hintKey() | translate }}</span>
    }
  </nz-form-control>
</nz-form-item>

<!-- 仅值控件：逻辑地址（只读，随功能码与起始地址联动）。表单项骨架与标签由父组件 command.edit 提供 -->
<div class="cmd-logical-line">
  @if (logicalAddress() != null) {
    <span class="cmd-logical">{{ logicalAddress() }}</span>
    <span class="cmd-value-note">（{{ '由功能码与起始地址换算' | translate }}）</span>
  } @else {
    <span>-</span>
  }
</div>

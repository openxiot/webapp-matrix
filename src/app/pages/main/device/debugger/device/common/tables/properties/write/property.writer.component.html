<div>
  <property-write-value [service]="data.service" [property]="data.property" (valueChange)="onValueChanged($event)"></property-write-value>
</div>

@if (operation()) {
  <div class="results">
    @switch (operation()!.status) {
      @case (0) {
        <nz-result nzStatus="success" [nzTitle]="'写属性成功！' | translate"></nz-result>
      }
      @default {
        <nz-descriptions nzBordered [nzTitle]="'写属性失败' | translate" [nzSize]="'small'" nzLayout="horizontal" [nzColumn]="1">
          <nz-descriptions-item [nzTitle]="'状态码' | translate">{{operation()!.status}}</nz-descriptions-item>
          <nz-descriptions-item [nzTitle]="'描述' | translate">{{operation()!.description}}</nz-descriptions-item>
        </nz-descriptions>
      }
    }
  </div>
}

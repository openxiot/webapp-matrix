<div class="results">
  @if (operation()) {
    @switch (operation()!.status) {
      @case (0) {
        <property-read-value [service]="data.service" [property]="data.property" [value]="operation()!.value"></property-read-value>
      }
      @default {
        <nz-descriptions nzBordered [nzTitle]="'读属性失败' | translate" [nzSize]="'small'" nzLayout="horizontal" [nzColumn]="1">
          <nz-descriptions-item [nzTitle]="'状态码' | translate">{{ operation()!.status }}</nz-descriptions-item>
          <nz-descriptions-item [nzTitle]="'描述' | translate">{{ operation()!.description }}</nz-descriptions-item>
        </nz-descriptions>
      }
    }
  }
</div>

<nz-page-header (nzBack)="location.back()" nzBackIcon [nzTitle]="titleTpl" [nzGhost]="false">
  <nz-breadcrumb [nzAutoGenerate]="true" nz-page-header-breadcrumb appBreadcrumbTranslate></nz-breadcrumb>

  <!-- 三视图切换：同居宿，切哪个渲染哪个。文案直接在模板里走 translate。 -->
  <nz-page-header-extra>
    <nz-radio-group [ngModel]="viewMode()" (ngModelChange)="onViewChange($event)" nzButtonStyle="solid">
      <label nz-radio-button [nzValue]="'table'">{{ '表格' | translate }}</label>
      <label nz-radio-button [nzValue]="'tree'">{{ '树' | translate }}</label>
      <label nz-radio-button [nzValue]="'3d'">{{ '3D' | translate }}</label>
    </nz-radio-group>
  </nz-page-header-extra>
</nz-page-header>

<!-- 三种视图是平级子组件。@switch 只建当前匹配分支 —— 3D 是重 WebGL 场景，切到才建实例，
     免得默认加载（甚至根本没切过去）就抢一个 0 尺寸的 context。 -->
@switch (viewMode()) {
  @case ('table') {
    <project-table-view />
  }
  @case ('tree') {
    <project-tree-view />
  }
  @case ('3d') {
    <project-3d-view />
  }
}

<ng-template #titleTpl>{{ projectName() || ('项目' | translate) }}</ng-template>

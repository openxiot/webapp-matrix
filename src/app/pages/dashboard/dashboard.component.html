<div style="padding: 20px 20px">
  <nz-row [nzGutter]="[16, 16]" style="margin-bottom: 16px">
    <nz-col [nzXs]="12" [nzMd]="6">
      <nz-card>
        <nz-statistic [nzTitle]="statDeviceTotal" [nzValue]="deviceTotal()" [nzSuffix]="'台' | translate">
          <ng-template #statDeviceTotal>
            <nz-icon nzType="appstore" nzTheme="outline" />
            {{ '设备总量' | translate }}
          </ng-template>
        </nz-statistic>
      </nz-card>
    </nz-col>
    <nz-col [nzXs]="12" [nzMd]="6">
      <nz-card>
        <nz-statistic [nzTitle]="statOnline" [nzValue]="onlineCount()" [nzSuffix]="'台' | translate">
          <ng-template #statOnline>
            <nz-icon nzType="check" nzTheme="outline" />
            {{ '在线设备' | translate }}
          </ng-template>
        </nz-statistic>
      </nz-card>
    </nz-col>
    <nz-col [nzXs]="12" [nzMd]="6">
      <nz-card>
        <nz-statistic [nzTitle]="statEnergy" [nzValue]="monthEnergy()" [nzSuffix]="'kWh'">
          <ng-template #statEnergy>
            <nz-icon nzType="thunderbolt" nzTheme="outline" />
            {{ '本月能耗' | translate }}
          </ng-template>
        </nz-statistic>
      </nz-card>
    </nz-col>
    <nz-col [nzXs]="12" [nzMd]="6">
      <nz-card>
        <nz-statistic [nzTitle]="statAlarm" [nzValue]="alarmToday()" [nzSuffix]="'条' | translate">
          <ng-template #statAlarm>
            <nz-icon nzType="alert" nzTheme="outline" />
            {{ '今日报警' | translate }}
          </ng-template>
        </nz-statistic>
      </nz-card>
    </nz-col>
  </nz-row>

  <nz-row [nzGutter]="[16, 16]">
    <nz-col [nzXs]="24" [nzMd]="12">
      <nz-card [nzTitle]="'设备类型分布' | translate">
        <div class="chart" [appEcharts]="deviceTypeOption"></div>
      </nz-card>
    </nz-col>
    <nz-col [nzXs]="24" [nzMd]="12">
      <nz-card [nzTitle]="'日能耗曲线' | translate">
        <div class="chart" [appEcharts]="energyOption"></div>
      </nz-card>
    </nz-col>
    <nz-col [nzXs]="24" [nzMd]="12">
      <nz-card [nzTitle]="'报警类型分布' | translate">
        <div class="chart" [appEcharts]="alarmTypeOption"></div>
      </nz-card>
    </nz-col>
    <nz-col [nzXs]="24" [nzMd]="12">
      <nz-card [nzTitle]="'报警曲线' | translate">
        <div class="chart" [appEcharts]="alarmCurveOption"></div>
      </nz-card>
    </nz-col>
  </nz-row>
</div>

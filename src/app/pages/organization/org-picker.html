<div class="page">
  <div class="page-header">
    <button nz-button nzType="text" (click)="routerBack()">
      <nz-icon nzType="left" nzTheme="outline" />
      返回
    </button>
    <span class="page-title">我的组织</span>
    <button nz-button nzType="primary" class="create-btn" (click)="openCreate()">
      <nz-icon nzType="plus" nzTheme="outline" />
      创建组织
    </button>
  </div>

  <nz-spin [nzSpinning]="loading">
    <nz-list [nzDataSource]="account.organizations" [nzRenderItem]="orgItem" [nzItemLayout]="'horizontal'">
      <ng-template #orgItem let-org>
        <nz-list-item
          class="org-item"
          [class.selected]="account.organization?.id === org.id"
          (click)="select(org)"
        >
          <nz-list-item-meta
            [nzTitle]="title"
            [nzDescription]="description"
            [nzAvatar]="avatar"
          >
            <ng-template #avatar>
              <span class="org-avatar">{{ org.name.charAt(0) }}</span>
            </ng-template>
            <ng-template #title>
              <span class="org-name">{{ org.name }}</span>
              @if (account.organization?.id === org.id) {
                <nz-tag class="current-tag" nzColor="blue">当前</nz-tag>
              }
            </ng-template>
            <ng-template #description>
              <span class="org-id">{{ org.id }}</span>
              <span class="org-members">{{ org.members.length }} 位成员</span>
            </ng-template>
          </nz-list-item-meta>
          <div class="org-actions" (click)="$event.stopPropagation()">
            <button nz-button nzSize="small" nz-tooltip [nzTooltipTitle]="'成员管理'" (click)="toDetail(org)">
              <nz-icon nzType="team" nzTheme="outline" />
            </button>
            <button nz-button nzSize="small" nz-tooltip [nzTooltipTitle]="'重命名'" (click)="openRename(org)">
              <nz-icon nzType="edit" nzTheme="outline" />
            </button>
            <button
              nz-button
              nzSize="small"
              nz-tooltip
              [nzTooltipTitle]="'删除'"
              nz-popconfirm
              [nzPopconfirmTitle]="'确定要删除这个组织吗？'"
              [nzPopconfirmPlacement]="'top'"
              (nzOnConfirm)="remove(org)"
            >
              <nz-icon nzType="delete" nzTheme="outline" />
            </button>
          </div>
        </nz-list-item>
      </ng-template>
    </nz-list>

    @if (!loading && account.organizations.length === 0) {
      <nz-empty nzNotFoundImage="simple" nzNotFoundContent="暂无组织" />
    }
  </nz-spin>
</div>

<!-- 创建组织 -->
<nz-modal
  [(nzVisible)]="createVisible"
  nzTitle="创建组织"
  [nzOkText]="'创建'"
  [nzCancelText]="'取消'"
  (nzOnOk)="submitCreate()"
>
  <div class="form-item">
    <label for="org-id">组织标识</label>
    <input id="org-id" nz-input placeholder="仅限英文字母/数字/中划线，以字母开头" [(ngModel)]="newId" />
  </div>
  <div class="form-item">
    <label for="org-name">组织名称</label>
    <input id="org-name" nz-input placeholder="组织显示名称" [(ngModel)]="newName" />
  </div>
</nz-modal>

<!-- 重命名组织 -->
<nz-modal
  [(nzVisible)]="renameVisible"
  nzTitle="重命名组织"
  [nzOkText]="'保存'"
  [nzCancelText]="'取消'"
  (nzOnOk)="submitRename()"
>
  <div class="form-item">
    <label for="rename-name">组织名称</label>
    <input id="rename-name" nz-input [(ngModel)]="renameName" />
  </div>
</nz-modal>

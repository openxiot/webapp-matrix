<div class="page">
  <div class="page-header">
    <button nz-button nzType="text" (click)="routerBack()">
      <nz-icon nzType="left" nzTheme="outline" />
      返回
    </button>
    <span class="page-title">组织：{{ organization?.name || '' }}</span>
    @if (isAdmin()) {
      <button nz-button nzType="primary" class="create-btn" (click)="openAdd()">
        <nz-icon nzType="plus" nzTheme="outline" />
        添加成员
      </button>
    }
  </div>

  <nz-spin [nzSpinning]="loading">
    <nz-list [nzDataSource]="organization?.members || []" [nzRenderItem]="memberItem">
      <ng-template #memberItem let-member>
        <nz-list-item class="member-item">
          <nz-list-item-meta
            [nzTitle]="title"
            [nzDescription]="description"
            [nzAvatar]="avatar"
          >
            <ng-template #avatar>
              <span class="member-avatar">{{ member.name.charAt(0) }}</span>
            </ng-template>
            <ng-template #title>
              <span class="member-name">{{ member.name }}</span>
              @if (isCurrentUser(member)) {
                <nz-tag nzColor="green">我</nz-tag>
              }
              <nz-tag [nzColor]="member.role === 'admin' ? 'gold' : 'default'">
                {{ roleLabel(member.role) }}
              </nz-tag>
            </ng-template>
            <ng-template #description>
              <span class="member-id">{{ member.developerId }}</span>
            </ng-template>
          </nz-list-item-meta>
          @if (isEditable(member)) {
            <div class="member-actions">
              <button nz-button nzSize="small" nz-tooltip [nzTooltipTitle]="'修改角色'" (click)="openRole(member)">
                <nz-icon nzType="edit" nzTheme="outline" />
              </button>
              <button
                nz-button
                nzSize="small"
                nz-tooltip
                [nzTooltipTitle]="'移除成员'"
                nz-popconfirm
                [nzPopconfirmTitle]="'确定要移除该成员吗？'"
                (nzOnConfirm)="remove(member)"
              >
                <nz-icon nzType="delete" nzTheme="outline" />
              </button>
            </div>
          }
        </nz-list-item>
      </ng-template>
    </nz-list>

    @if (!loading && (organization?.members?.length || 0) === 0) {
      <nz-empty nzNotFoundImage="simple" nzNotFoundContent="暂无成员" />
    }
  </nz-spin>
</div>

<!-- 添加成员 -->
<nz-modal
  [(nzVisible)]="addVisible"
  nzTitle="添加成员"
  [nzOkText]="'添加'"
  [nzCancelText]="'取消'"
  (nzOnOk)="submitAdd()"
>
  <div class="form-item">
    <label for="dev-id">developerId</label>
    <input id="dev-id" nz-input placeholder="必填" [(ngModel)]="newDeveloperId" />
  </div>
  <div class="form-item">
    <label for="mem-name">显示名称</label>
    <input id="mem-name" nz-input placeholder="选填，默认为 developerId" [(ngModel)]="newName" />
  </div>
  <div class="form-item">
    <label>角色</label>
    <nz-radio-group [(ngModel)]="newRole">
      <label nz-radio nzValue="member">成员</label>
      <label nz-radio nzValue="admin">管理员</label>
    </nz-radio-group>
  </div>
</nz-modal>

<!-- 修改角色 -->
<nz-modal
  [(nzVisible)]="roleVisible"
  nzTitle="修改角色"
  [nzOkText]="'保存'"
  [nzCancelText]="'取消'"
  (nzOnOk)="submitRole()"
>
  <div class="form-item">
    <nz-radio-group [(ngModel)]="changeRole">
      <label nz-radio nzValue="member">成员</label>
      <label nz-radio nzValue="admin">管理员</label>
    </nz-radio-group>
  </div>
</nz-modal>

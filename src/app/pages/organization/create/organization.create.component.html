<nz-spin [nzSpinning]="loading()">
  <nz-page-header (nzBack)="location.back()" nzBackIcon [nzTitle]="pageTitle" [nzGhost]="false">
    <nz-breadcrumb [nzAutoGenerate]="true" nz-page-header-breadcrumb appBreadcrumbTranslate></nz-breadcrumb>
  </nz-page-header>

  <ng-template #pageTitle>
    {{ '创建组织' | translate }}
  </ng-template>

  <div style="padding: 20px 20px">
    <nz-card nzSize="small">
      <form nz-form [formGroup]="form" (ngSubmit)="submitForm()">
        <nz-form-item>
          <nz-form-label [nzSpan]="4" [nzRequired]="true" nzFor="code">{{ '组织代码' | translate }}</nz-form-label>
          <nz-form-control [nzSpan]="10" [nzErrorTip]="codeErrorTip">
            <spec-code formControlName="code" [updatable]="true"></spec-code>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzSpan]="4" [nzRequired]="true" nzFor="name">{{ '组织名称' | translate }}</nz-form-label>
          <nz-form-control [nzSpan]="8">
            <input type="text" nz-input formControlName="name" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-control [nzSpan]="4" [nzOffset]="4">
            <button nz-button nzType="primary">{{ '提交' | translate }}</button>
          </nz-form-control>
        </nz-form-item>
      </form>
    </nz-card>
  </div>
</nz-spin>

<ng-template #codeErrorTip>
  @if (form.get('code')?.errors?.['required']) {
    <span>{{ '请输入代码' | translate }}</span>
  }
  @if (form.get('code')?.errors?.['pattern']) {
    <span>{{ '代码必须以小写字母开头，可包含小写字母、数字、中划线' | translate }}</span>
  }
</ng-template>

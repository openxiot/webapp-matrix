<div class="page">
  <div class="page-header">
    <button nz-button nzType="text" (click)="routerBack()">
      <nz-icon nzType="left" nzTheme="outline" />
      返回
    </button>
    <span class="page-title">{{ displayName() }}</span>
  </div>

  <nz-spin [nzSpinning]="loading">
    @if (loadError) {
      <nz-empty nzNotFoundImage="simple" nzNotFoundContent="产品加载失败" />
    } @else if (product) {
      <nz-card [nzBordered]="false" class="head-card">
        <div class="head-row">
          @if (product.icon) {
            <img class="product-icon" [src]="product.icon" alt="" />
          } @else {
            <span class="product-icon fallback">
              <nz-icon nzType="appstore" nzTheme="outline" />
            </span>
          }
          <div class="head-info">
            <div class="product-name">{{ displayName() }}</div>
            <nz-tag [nzColor]="lifecycleColor()">{{ lifecycleLabel() }}</nz-tag>
          </div>
        </div>
      </nz-card>

      <nz-card [nzBordered]="false" class="info-card">
        <nz-descriptions nzSize="small" [nzColumn]="1">
          <nz-descriptions-item nzTitle="产品 ID">{{ product.id }}</nz-descriptions-item>
          <nz-descriptions-item nzTitle="产品型号">{{ product.model }}</nz-descriptions-item>
          <nz-descriptions-item nzTitle="通信协议">{{ product.protocol }}</nz-descriptions-item>
          <nz-descriptions-item nzTitle="所属组织">{{ product.organization }}</nz-descriptions-item>
        </nz-descriptions>
      </nz-card>

      <div class="buy-actions">
        <button nz-button nzBlock class="buy-jd" (click)="goJd()">
          <nz-icon nzType="shop" nzTheme="outline" />
          去京东购买
        </button>
        <button nz-button nzBlock class="buy-taobao" (click)="goTaobao()">
          <nz-icon nzType="shop" nzTheme="outline" />
          去淘宝购买
        </button>
      </div>
    }
  </nz-spin>
</div>

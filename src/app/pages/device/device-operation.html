<div class="page">
  <div class="page-header">
    <button nz-button nzType="text" (click)="routerBack()">
      <nz-icon nzType="left" nzTheme="outline" />
      返回
    </button>
    <span class="page-title">设备操作</span>
  </div>

  <nz-spin [nzSpinning]="loading || writing">
    @if (loadError) {
      <nz-empty nzNotFoundImage="simple" [nzNotFoundContent]="'设备类型定义加载失败'" />
      <div class="error-text">{{ loadError }}</div>
    } @else if (switches.length === 0) {
      <nz-empty nzNotFoundImage="simple" nzNotFoundContent="该设备没有可操作的开关属性" />
    } @else {
      <div class="device-name-bar">{{ deviceName() }}</div>
      <nz-card [nzBordered]="false">
        @for (item of switches; track item.serviceIid + ':' + item.iid) {
          <div class="switch-row">
            <span class="switch-name">{{ item.name }}</span>
            <nz-switch [ngModel]="item.value" (ngModelChange)="onToggle(item, $event)"></nz-switch>
          </div>
        }
      </nz-card>
    }
  </nz-spin>
</div>
